apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sm-operator
  namespace: flux-system
  labels:
    app.kubernetes.io/component: sm-operator
    app.kubernetes.io/part-of: bootstrap
spec:
  # Deploys the sm-operator
  # Waits for helm-repos so the HelmRepository index is ready.
  interval: 10m
  path: ./bootstrap/sm-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: helm-repos
