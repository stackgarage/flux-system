app:
  name: actualbudget
  image:
    repository: docker.io/actualbudget/actual-server
    pullPolicy: IfNotPresent
    tag: latest@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3 # renovate: depName=docker.io/actualbudget/actual-server datasource=docker

  service:
    port: 80
    targetPort: 5006

  volumeMounts:
    - mountPath: /data
      subPath: data

  livenessProbe:
    enabled: true
    command: ["node", "src/scripts/health-check.js"]
    initialDelaySeconds: 20
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 3
